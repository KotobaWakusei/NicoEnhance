name: Build and Publish Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nicoenhance-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      KS_STORE_PASSWORD: ${{ secrets.KS_STORE_PASSWORD }}
      KS_KEY_ALIAS: ${{ secrets.KS_KEY_ALIAS }}
      KS_KEY_PASSWORD: ${{ secrets.KS_KEY_PASSWORD }}
      HAS_KS: ${{ secrets.KS_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore keystore
        if: env.HAS_KS == 'true'
        env:
          KS_BASE64: ${{ secrets.KS_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$KS_BASE64" | base64 -d > app/keystore/nicoenhance.jks
          test -s app/keystore/nicoenhance.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          validate-wrappers: false

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Calculate next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)"
          if [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            major=1
            minor=0
            patch=-1
          fi

          patch=$((patch + 1))
          version="${major}.${minor}.${patch}"
          # Keep Android versionCode monotonic even when release tags are reset to v1.0.0.
          # GitHub run numbers are unique and current values exceed previous semver-derived codes.
          code=$((100000 + GITHUB_RUN_NUMBER))

          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "Next release: v$version (versionCode=$code)"


      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}"

      - name: Verify APK signature and package metadata
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"

          # Android SDK tools are installed under build-tools and are not guaranteed
          # to be present directly on PATH on GitHub-hosted runners.
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n1)"
          test -n "$build_tools"
          apksigner="$build_tools/apksigner"
          aapt="$build_tools/aapt"
          test -x "$apksigner"
          test -x "$aapt"

          "$apksigner" verify --verbose --print-certs "$apk"
          "$aapt" dump badging "$apk" | tee /tmp/apk-badging.txt
          grep -q "package: name='io.github.kotobawakusei.nicoenhance'" /tmp/apk-badging.txt
          grep -q "sdkVersion:'29'" /tmp/apk-badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/apk-badging.txt
          sha256sum "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NicoEnhance-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove previous releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' |
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            echo "Deleting old release: $tag"
            gh release delete "$tag" --repo "${{ github.repository }}" --yes
          done

      - name: Create the new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version_name }}"
          apk="app/build/outputs/apk/release/app-release.apk"

          gh release create "$tag" "$apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "NicoEnhance $tag" \
            --generate-notes \
            --latest

