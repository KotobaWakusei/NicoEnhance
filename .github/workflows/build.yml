name: Build Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_STORE_PASSWORD: ${{ secrets.KS_STORE_PASSWORD }}
      KS_KEY_ALIAS:     ${{ secrets.KS_KEY_ALIAS }}
      KS_KEY_PASSWORD:  ${{ secrets.KS_KEY_PASSWORD }}
      HAS_KS:           ${{ secrets.KS_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore keystore from secret
        if: env.HAS_KS == 'true'
        env:
          KS_BASE64: ${{ secrets.KS_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$KS_BASE64" | base64 -d > app/keystore/nicoenhance.jks
          test -s app/keystore/nicoenhance.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          validate-wrappers: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Derive version from git tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
            # 语义化版本 -> versionCode: 1.0.4 => 10004
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VER}"
            CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
            echo "version_name=${VER}" >> "$GITHUB_OUTPUT"
            echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release APK
        run: |
          ARGS=()
          if [[ -n "${{ steps.version.outputs.version_name }}" ]]; then
            ARGS+=("-PversionName=${{ steps.version.outputs.version_name }}")
            ARGS+=("-PversionCode=${{ steps.version.outputs.version_code }}")
          fi
          ./gradlew assembleRelease "${ARGS[@]}"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NicoEnhance-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "${{ github.repository }}" --clobber || true
          else
            gh release create "$TAG" "$APK" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Update rolling release
        if: github.ref == 'refs/heads/main' && env.HAS_KS == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          RELEASE_TAG="NicoEnhance"
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "NicoEnhance - $(date +%Y-%m-%d)" \
              --generate-notes || true
            gh release upload "$RELEASE_TAG" "$APK" \
              --repo "${{ github.repository }}" \
              --clobber || true
          else
            gh release create "$RELEASE_TAG" "$APK" \
              --repo "${{ github.repository }}" \
              --title "NicoEnhance - $(date +%Y-%m-%d)" \
              --generate-notes
          fi
